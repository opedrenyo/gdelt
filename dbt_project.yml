name: dbt_gdelt

profile: dbt_gdelt

seed-paths: ["seeds"]
model-paths: ["models"]
macro-paths: ["macros"]
clean-targets:
  - "target"
  - "dbt_packages"

models:
  dbt_gdelt:
    +static_analysis: strict
    # Materialize staging models as views, and marts as tables
    staging:
      +materialized: table
    intermediate:
      +materialized: table
    marts:
      +materialized: table
flags:
  require_generic_test_arguments_property: true